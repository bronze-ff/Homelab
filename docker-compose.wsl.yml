####################################################################
# Homelab — PC de casa (Ryzen 5 5600G · 16 GB · RTX 5060)
# Windows 11 + WSL2 (Debian) + Docker Engine nativo no WSL (sem Docker Desktop).
#
# Paths: ${MEDIA_PATH}        -> /media  (D:\Homelab no HD de 1 TB: biblioteca + downloads,
#                                         mesmo disco = hardlink)
#        ${CONFIG_PATH}/<app> -> /config (ext4 dentro do disco virtual do WSL, no SSD E:;
#                                         evita o "database is locked" do SQLite no 9p)
#
# Modo jogo da Casa Local: os serviços pesados param (mídia, downloads, Frigate) e os leves
# de aviso e monitoramento continuam (ntfy, Uptime Kuma, Diun, Dozzle, Vaultwarden, openGym); ao sair, `docker compose up -d` traz tudo de volta.
# Portas publicadas no Windows pelo modo de rede "mirrored" do WSL (ver WSL.md).
####################################################################

name: homelab

networks:
  homelab:
    name: homelab
    driver: bridge

x-linuxserver: &linuxserver
  networks: [homelab]
  restart: unless-stopped
  environment: &env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

services:
  # ---------------- Jellyfin (streaming) ----------------
  # Transcode por hardware na RTX 5060 (NVENC/NVDEC): precisa do NVIDIA Container
  # Toolkit no WSL (WSL.md). Sem ele, comente o bloco "deploy".
  jellyfin:
    <<: *linuxserver
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    volumes:
      - ${CONFIG_PATH}/jellyfin:/config
      - ${MEDIA_PATH}:/media
    ports:
      - "8096:8096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    mem_limit: 2g

  # ---------------- qBittorrent (download) ----------------
  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ${CONFIG_PATH}/qbittorrent:/config
      - ${MEDIA_PATH}:/media
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    mem_limit: 1g

  # ---------------- Prowlarr (indexadores) ----------------
  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # DNS público: o DNS do provedor bloqueia alguns indexadores ("Name does not resolve").
    dns: [1.1.1.1, 8.8.8.8]
    volumes:
      - ${CONFIG_PATH}/prowlarr:/config
    ports:
      - "9696:9696"
    mem_limit: 400m

  # ---------------- FlareSolverr (bypass Cloudflare) ----------------
  # Aqui há RAM sobrando: fica ligado (só a rede interna o usa: http://flaresolverr:8191).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks: [homelab]
    dns: [1.1.1.1, 8.8.8.8]
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    mem_limit: 600m
    restart: unless-stopped

  # ---------------- Radarr (filmes) ----------------
  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ${CONFIG_PATH}/radarr:/config
      - ${MEDIA_PATH}:/media
    ports:
      - "7878:7878"
    mem_limit: 500m

  # ---------------- Sonarr (séries + anime) ----------------
  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ${CONFIG_PATH}/sonarr:/config
      - ${MEDIA_PATH}:/media
    ports:
      - "8989:8989"
    mem_limit: 500m

  # ---------------- Bazarr (legendas PT-BR) ----------------
  bazarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    volumes:
      - ${CONFIG_PATH}/bazarr:/config
      - ${MEDIA_PATH}:/media
    ports:
      - "6767:6767"
    mem_limit: 400m

  # ---------------- Seerr (pedidos; sucessor do Jellyseerr) ----------------
  # Mesma pasta de config do Jellyseerr: o banco migra sozinho no 1º início. Roda como UID 1000.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks: [homelab]
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_PATH}/jellyseerr:/app/config
    ports:
      - "5055:5055"
    mem_limit: 500m
    restart: unless-stopped

  # ---------------- Homarr (dashboard) — opcional ----------------
  # Neste PC o painel do home lab é a aba Lab da Casa Local (status, links, modo jogo),
  # então o Homarr não sobe por padrão. Para usar: docker compose --profile extras up -d homarr
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    profiles: [extras]
    networks: [homelab]
    environment:
      TZ: ${TZ}
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET}
    volumes:
      - ${CONFIG_PATH}/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "7575:7575"
    mem_limit: 600m
    restart: unless-stopped

  # ---------------- Filebrowser (arquivos da mídia pelo navegador) ----------------
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    networks: [homelab]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      FB_DATABASE: /database/filebrowser.db
      FB_ROOT: /srv
      FB_PORT: 80
    volumes:
      - ${MEDIA_PATH}:/srv
      - ${CONFIG_PATH}/filebrowser:/database
    ports:
      - "8081:80"
    mem_limit: 150m
    restart: unless-stopped

  # ---------------- Configarr (perfis TRaSH / PT-BR, sob demanda) ----------------
  #   docker compose -f docker-compose.wsl.yml run --rm configarr
  configarr:
    image: ghcr.io/raydak-labs/configarr:latest
    container_name: configarr
    networks: [homelab]
    user: ${PUID}:${PGID}
    profiles: [tools]
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_PATH}/configarr/config:/app/config
      - ${CONFIG_PATH}/configarr/cfs:/app/cfs
      - ${CONFIG_PATH}/configarr/repos:/app/repos
    restart: "no"

  # ---------------- openGym (treinos e peso) ----------------
  # github.com/DuarteSantos8/openGym. Passkeys exigem HTTPS: servido pelo
  # `tailscale serve --https=8443` em https://<host>.ts.net:8443 (OPENGYM_* no .env).
  opengym-api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    container_name: opengym-api
    networks: [homelab]
    environment:
      PORT: 3000
      DATA_DIR: /data
      TRUST_PROXY: 1
      RP_ID: ${OPENGYM_RP_ID}
      ORIGIN: ${OPENGYM_ORIGIN}
      RP_NAME: openGym
      FIRST_USER_ADMIN: 1
      DEFAULT_LANG: pt-BR
      INVITE_ONLY: ${OPENGYM_INVITE_ONLY:-0}
    volumes:
      - ${CONFIG_PATH}/opengym:/data
    mem_limit: 300m
    restart: unless-stopped

  opengym-web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    container_name: opengym-web
    networks: [homelab]
    depends_on: [opengym-api]
    environment:
      NGINX_PORT: 80
      BACKEND: opengym-api
      PORT: 3000
      RESOLVER: 127.0.0.11
    ports:
      - "8090:80"
    mem_limit: 150m
    restart: unless-stopped

  # ================== Avisos, monitoramento e manutenção ==================
  # Ficam ligados no modo jogo (leves): os avisos do celular não param enquanto você joga.

  # ---------------- ntfy (push no celular) ----------------
  # https://<host>.ts.net:10000 pelo Tailscale Serve. No iPhone o ntfy.sh só "acorda" o app
  # (upstream); o conteúdo vem deste servidor.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    networks: [homelab]
    command: serve
    environment:
      TZ: ${TZ}
      NTFY_BASE_URL: ${NTFY_BASE_URL}
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_ATTACHMENT_EXPIRY_DURATION: 72h
      NTFY_ENABLE_LOGIN: "false"
    volumes:
      - ${CONFIG_PATH}/ntfy:/var/cache/ntfy
    ports:
      - "2586:80"
    mem_limit: 100m
    restart: unless-stopped

  # ---------------- Uptime Kuma (disponibilidade dos serviços) ----------------
  # Rede do host: enxerga os containers e também a Casa Local e o go2rtc no Windows.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    network_mode: host
    environment:
      TZ: ${TZ}
      UPTIME_KUMA_PORT: 3001
    volumes:
      - ${CONFIG_PATH}/uptime-kuma:/app/data
    mem_limit: 300m
    restart: unless-stopped

  # ---------------- Diun (avisa quando há versão nova; não atualiza sozinho) ----------------
  diun:
    image: crazymax/diun:latest
    container_name: diun
    networks: [homelab]
    command: serve
    environment:
      TZ: ${TZ}
      DIUN_WATCH_SCHEDULE: "0 9 * * *"
      DIUN_WATCH_FIRSTCHECKNOTIF: "false"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_NTFY_ENDPOINT: http://ntfy:80
      DIUN_NOTIF_NTFY_TOPIC: ${NTFY_TOPIC_SISTEMA:-casa-sistema}
      DIUN_NOTIF_NTFY_PRIORITY: "2"
    volumes:
      - ${CONFIG_PATH}/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 80m
    restart: unless-stopped

  # ---------------- Dozzle (logs dos containers no navegador) ----------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    networks: [homelab]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"
    mem_limit: 80m
    restart: unless-stopped

  # ---------------- Unpackerr (extrai .rar para Radarr/Sonarr) ----------------
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    networks: [homelab]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
      UN_SONARR_0_PATHS_0: /media/torrents
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_RADARR_0_PATHS_0: /media/torrents
    volumes:
      - ${MEDIA_PATH}:/media
    mem_limit: 100m
    restart: unless-stopped

  # ---------------- Vaultwarden (senhas, app Bitwarden) ----------------
  # https://<host>.ts.net/vault (Tailscale Serve no caminho /vault). Para restaurar o backup
  # antigo, troque ${CONFIG_PATH}/vaultwarden pelo conteúdo extraído (WSL.md).
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    networks: [homelab]
    environment:
      TZ: ${TZ}
      DOMAIN: ${VAULTWARDEN_DOMAIN}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS:-true}
    volumes:
      - ${CONFIG_PATH}/vaultwarden:/data
    ports:
      - "8222:80"
    mem_limit: 200m
    restart: unless-stopped

  # Finanças da casa (Actual Budget). Só no 127.0.0.1: o acesso é pelo Tailscale Serve em HTTPS
  # (https://<pc>.ts.net:8445), que o app exige. A senha do servidor é criada no primeiro acesso.
  actual:
    image: actualbudget/actual-server:latest
    container_name: actual
    networks: [homelab]
    environment:
      TZ: ${TZ}
      ACTUAL_PORT: 5006
    volumes:
      - ${CONFIG_PATH}/actual:/data
    ports:
      - "127.0.0.1:5006:5006"
    mem_limit: 300m
    restart: unless-stopped

  # ---------------- AdGuard Home (DNS e bloqueio de anúncios) ----------------
  # DNS na porta 53 do PC; painel em http://<pc>:3053. Os aparelhos só usam se você apontar
  # o DNS do roteador ou do Tailscale para este PC (WSL.md explica o cuidado com o PC desligado).
  # Fica desligado aqui (perfil "extras"): no Windows deste PC a porta 53 já é de um serviço do
  # sistema (svchost), então o DNS não tem como responder para a rede.
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    profiles: [extras]
    networks: [homelab]
    volumes:
      - ${CONFIG_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${CONFIG_PATH}/adguardhome/conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3053:3000"
    mem_limit: 200m
    restart: unless-stopped

  # ================== Câmeras inteligentes ==================
  # ---------------- Frigate (pessoas, carros e rostos na RTX) ----------------
  # Só detecção: o DVR continua gravando. Lê o RTSP direto do DVR (credenciais FRIGATE_DVR_* no
  # .env); rede do host para a Casa Local falar com a API interna em 127.0.0.1:5000. API interna só em 127.0.0.1:5000 (a Casa Local usa); painel com
  # login em https://<pc>:8971. Para no modo jogo (usa a GPU).
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2-tensorrt
    container_name: frigate
    network_mode: host
    shm_size: "512mb"
    environment:
      TZ: ${TZ}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
      FRIGATE_DVR_USER: ${FRIGATE_DVR_USER}
      FRIGATE_DVR_PASS: ${FRIGATE_DVR_PASS}
      FRIGATE_DVR_HOST: ${FRIGATE_DVR_HOST}
    volumes:
      - ${CONFIG_PATH}/frigate:/config
      - ${CONFIG_PATH}/frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 500000000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]
    mem_limit: 3g
    restart: unless-stopped
